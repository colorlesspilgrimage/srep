services:
  srep:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${SREP_PORT:-3000}:3000'
    environment:
      SREP_DATABASE_URL: ${SREP_DATABASE_URL:-sqlite:/data/srep.db}
      SREP_ORIGIN: ${SREP_ORIGIN:-http://localhost:3000}
      SREP_RP_ID: ${SREP_RP_ID:-localhost}
    volumes:
      - srep-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    profiles: ['postgres']
    image: postgres:17
    environment:
      POSTGRES_USER: srep
      POSTGRES_DB: srep
      POSTGRES_PASSWORD: ${SREP_POSTGRES_PASSWORD:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${SREP_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'srep', '-d', 'srep']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  srep-data: {}
  pg-data: {}
