[package]
name = "srep-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "srep_server"
path = "src/lib.rs"

[[bin]]
name = "srep-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
mime_guess = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
srep-auth = { path = "../srep-auth" }
srep-browse = { path = "../srep-browse" }
srep-config = { path = "../srep-config" }
srep-db = { path = "../srep-db" }
srep-domain = { path = "../srep-domain" }
srep-import = { path = "../srep-import" }
srep-stats = { path = "../srep-stats" }
srep-study = { path = "../srep-study" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
