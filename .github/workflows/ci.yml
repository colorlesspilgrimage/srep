name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-sqlite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: PROFILE=release ./scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.17.0 <23.0.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Rust server)
        run: npm run test:e2e
        env:
          SREP_E2E_RUST: '1'
          E2E_DATABASE_URL: sqlite:./data/e2e.db
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sqlite
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 1

  e2e-postgres:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: PROFILE=release ./scripts/build-wasm.sh
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start Postgres
        run: |
          docker pull postgres:17
          rm -f "$HOME/.docker/config.json"
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=srep -e POSTGRES_PASSWORD=srep-ci -e POSTGRES_DB=srep \
            postgres:17
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U srep -d srep && exit 0
            sleep 1
          done
          docker logs pg
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.17.0 <23.0.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Rust server)
        run: npm run test:e2e
        env:
          SREP_E2E_RUST: '1'
          E2E_DATABASE_URL: postgres://srep:srep-ci@localhost:5432/srep
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-postgres
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 1

  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the Rust image
        run: |
          docker build -t srep:ci -f Dockerfile .
          rm -f "$HOME/.docker/config.json"
      - name: Run the image and check health
        run: |
          docker run -d --name srep-ci -p 3000:3000 -v srep-ci-data:/data srep:ci
          ok=0
          health_file="${RUNNER_TEMP:-$HOME}/healthz.json"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > "$health_file"; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ] || ! grep -F '"status":"ok"' "$health_file"; then
            docker logs srep-ci
            docker rm -f srep-ci
            exit 1
          fi
          docker rm -f srep-ci
