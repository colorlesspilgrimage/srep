name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: srep
          POSTGRES_PASSWORD: srep-ci
          POSTGRES_DB: srep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests on Postgres
        if: matrix.db == 'postgres'
        run: npm run test
        env:
          SREP_TEST_POSTGRES_URL: postgres://srep:srep-ci@localhost:5432/srep
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://srep:srep-ci@localhost:5432/srep' || 'sqlite:./data/e2e.db' }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.db }}
          path: playwright-report/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t srep:ci .
      - name: Run the image and check health
        run: |
          docker run -d --name srep-ci -p 3000:3000 -v srep-ci-data:/data srep:ci
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3000/healthz > /tmp/healthz.json
          grep -F '{"status":"ok"}' /tmp/healthz.json
          docker rm -f srep-ci
