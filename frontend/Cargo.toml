[package]
name = "srep-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Location",
  "Storage",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "Crypto",
  "Navigator",
  "StorageManager",
  "DomException",
  "Event",
  "IdbDatabase",
  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbObjectStoreParameters",
  "IdbIndex",
  "IdbIndexParameters",
  "IdbCursor",
  "IdbCursorWithValue",
  "IdbKeyRange",
  "IdbVersionChangeEvent",
] }
