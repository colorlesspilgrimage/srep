[workspace]
resolver = "2"
members = [
  "crates/srep-config",
  "crates/srep-db",
  "crates/srep-auth",
  "crates/srep-domain",
  "crates/srep-study",
  "crates/srep-browse",
  "crates/srep-stats",
  "crates/srep-import",
  "crates/srep-cli",
  "crates/srep-server",
  "frontend",
]
default-members = ["crates/srep-server"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/colorlesspilgrimage/srep"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
clap = { version = "4", features = ["derive"] }
cookie = "0.18"
fsrs = "4"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
zip = { version = "1.3", default-features = false, features = ["deflate"] }
